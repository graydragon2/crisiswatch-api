# @anthropic-ai/sdk pulls in @streamparser/json, a transitive dependency
# that explicitly supports Deno. Nixpacks' auto-detection has been known
# to walk into that package inside node_modules and misidentify the whole
# repo as a Deno project (this happened on a sibling project after adding
# the same SDK). Pin the provider explicitly so build behavior doesn't
# depend on that detection succeeding.
providers = ["node"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
# Regenerates the Prisma client from schema.prisma — needs to happen on
# every deploy, not just when node_modules changes, since `npm ci` alone
# doesn't re-run generators. Uses the default (datasource-free)
# prisma.config.js, so this always succeeds even before DATABASE_URL
# exists as a Railway variable — see that file's comment. It has to: this
# runs on every deploy, including ones before DATABASE_URL is set, and a
# failed build here would take down the whole service, not just auth.
# (This project's Railway service also has its own dashboard-level
# "Custom Build Command" set to `npm install`, which takes precedence —
# harmless here since `npm install` still fires the `postinstall` hook
# that also runs `prisma generate`, unlike the start command below.)
cmds = ["npx prisma generate"]

[start]
# Delegates to the "start" script in package.json, which is where the
# actual migration guard lives (only attempts `prisma migrate deploy`
# when DATABASE_URL is set, otherwise boots straight to `node server.js`
# — same reasoning as the build phase above: a deploy before DATABASE_URL
# exists must not fail). It has to live in package.json rather than only
# here: this project's Railway service has its own dashboard-level
# "Custom Start Command" set to `npm start`, which takes precedence over
# this file — discovered the hard way when a deploy's migration silently
# never ran. Keeping the guard in package.json means it works regardless
# of which of the two actually executes.
cmd = "npm start"
